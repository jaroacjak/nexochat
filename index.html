<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoChat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1877f2, #6c5ce7);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 420px;
            text-align: center;
            padding: 40px 25px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            color: #1877f2;
            font-size: 42px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 17px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .login {
            background: white;
            color: #1877f2;
        }

        .register {
            border: 2px solid white;
            color: white;
            background: transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">N</div>

        <h1>NexoChat</h1>

        <p class="subtitle">
            Spoj sa s ľuďmi, na ktorých ti záleží.
        </p>

        <div class="buttons">

            <a href="login.html" class="btn login">
                Prihlásiť sa
            </a>

            <a href="register.html" class="btn register">
                Registrácia
            </a>

        </div>

        <p class="footer">
            © 2026 NexoChat
        </p>

    </main>

</body>
</html>
