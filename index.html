<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexoChat</title>
    <meta name="description" content="NexoChat – chat, správy a hovory na jednom mieste.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Horná lišta -->
    <header class="navbar">
        <div class="logo">
            NexoChat
        </div>

        <nav>
            <a href="/home">Domov</a>
            <a href="/messages">Správy</a>
            <a href="/calls">Volania</a>
            <a href="/profile">Profil</a>
        </nav>
    </header>

    <!-- Hlavná stránka -->
    <main id="home">

        <section class="hero">
            <div class="hero-content">
                <h1>Vitaj v NexoChat 👋</h1>

                <p>
                    Píš si s priateľmi, uskutočňuj hovory
                    a zostaň vždy v spojení.
                </p>

                <div class="hero-buttons">
                    <button id="loginButton">
                        Prihlásiť sa
                    </button>

                    <button id="registerButton">
                        Vytvoriť účet
                    </button>
                </div>
            </div>
        </section>

        <!-- Funkcie -->
        <section class="features">

            <div class="feature">
                <h2>💬 Správy</h2>
                <p>Posielaj správy svojim priateľom.</p>
            </div>

            <div class="feature">
                <h2>📞 Hovory</h2>
                <p>Uskutočňuj hlasové a video hovory.</p>
            </div>

            <div class="feature">
                <h2>🖥️ Zdieľanie obrazovky</h2>
                <p>Zdieľaj svoju obrazovku počas hovoru.</p>
            </div>

        </section>

    </main>

    <!-- Pätička -->
    <footer>
        <p>© 2026 NexoChat</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
