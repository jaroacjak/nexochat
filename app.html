<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoChat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f0f2f5;
            color: #222;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* =========================
           ĽAVÝ PANEL
        ========================= */

        .sidebar {
            width: 360px;
            background: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
        }

        .top {
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 43px;
            height: 43px;
            border-radius: 14px;
            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .top h1 {
            color: #1877f2;
            font-size: 24px;
        }

        .profile-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #f0f2f5;
            cursor: pointer;
            font-size: 19px;
        }

        .profile-btn:hover {
            background: #e4e6eb;
        }

        /* =========================
           PROFIL
        ========================= */

        .profile-info {
            display: none;
            padding: 15px;
            background: #f7f8fa;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #ddd;
        }

        .profile-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .profile-email {
            color: #777;
            font-size: 13px;
            word-break: break-word;
        }

        .logout-btn {
            margin-top: 12px;
            padding: 9px 14px;
            border: none;
            border-radius: 10px;
            background: #e4e6eb;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #d8dadf;
        }

        /* =========================
           VYHĽADÁVANIE
        ========================= */

        .search-wrapper {
            padding: 0 15px 15px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 13px 16px;
            border: none;
            outline: none;
            border-radius: 22px;
            background: #f0f2f5;
            font-size: 15px;
        }

        .suggestions {
            display: none;
            position: absolute;
            left: 15px;
            right: 15px;
            top: 52px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,.12);
            max-height: 300px;
            overflow-y: auto;
            z-index: 20;
        }

        .suggestions-title {
            padding: 10px 13px;
            color: #777;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }

        .suggestion {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #f0f2f5;
        }

        .suggestion-info {
            min-width: 0;
            flex: 1;
        }

        .suggestion-name {
            font-weight: bold;
            font-size: 15px;
        }

        .suggestion-email {
            color: #777;
            font-size: 12px;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .no-results {
            padding: 18px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        /* =========================
           AVATAR
        ========================= */

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 17px;
            flex-shrink: 0;
        }

        .small-avatar {
            width: 43px;
            height: 43px;
            font-size: 14px;
        }

        /* =========================
           ZOZNAM CHATOV
        ========================= */

        .chats {
            flex: 1;
            overflow-y: auto;
        }

        .chat {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            cursor: pointer;
        }

        .chat:hover {
            background: #f0f2f5;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .last-message {
            color: #777;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .time {
            color: #999;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 30px 15px;
            color: #888;
            font-size: 14px;
        }

        /* =========================
           PRAVÁ STRANA
        ========================= */

        .main {
            flex: 1;
            display: flex;
            background: #f7f8fa;
        }

        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .welcome-logo {
            width: 90px;
            height: 90px;
            border-radius: 28px;
            background: #1877f2;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #777;
            max-width: 430px;
            line-height: 1.5;
        }

        /* =========================
           CHAT OKNO
        ========================= */

        .chat-window {
            display: none;
            flex: 1;
            height: 100%;
            flex-direction: column;
        }

        .chat-header {
            height: 72px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 10px 18px;
            gap: 12px;
        }

        .chat-user {
            flex: 1;
            min-width: 0;
        }

        .chat-user-name {
            font-weight: bold;
            font-size: 17px;
        }

        .chat-status {
            color: #31a24c;
            font-size: 13px;
            margin-top: 3px;
        }

        .header-btn {
            width: 43px;
            height: 43px;
            border: none;
            border-radius: 50%;
            background: #f0f2f5;
            cursor: pointer;
            font-size: 19px;
        }

        .header-btn:hover {
            background: #e4e6eb;
        }

        /* =========================
           SPRÁVY
        ========================= */

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            max-width: 65%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 18px;
            background: white;
            width: fit-content;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }

        .message.mine {
            margin-left: auto;
            background: #1877f2;
            color: white;
        }

        .message-text {
            white-space: pre-wrap;
        }

        .message-file {
            margin-bottom: 5px;
        }

        .message-file a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }

        .message-file a:hover {
            text-decoration: underline;
        }

        .message-time {
            font-size: 11px;
            opacity: .65;
            margin-top: 5px;
        }

        /* =========================
           PÍSANIE
        ========================= */

        .message-form {
            background: white;
            border-top: 1px solid #ddd;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-input {
            flex: 1;
            border: none;
            outline: none;
            background: #f0f2f5;
            border-radius: 22px;
            padding: 13px 17px;
            font-size: 15px;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .send-btn:hover {
            background: #1264d6;
        }

        #fileInput {
            display: none;
        }

        /* =========================
           MODAL VOLANIA
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            width: 90%;
            max-width: 360px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        .modal-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .modal-box h3 {
            margin-bottom: 10px;
        }

        .modal-box p {
            color: #777;
            line-height: 1.5;
        }

        .close-btn {
            margin-top: 22px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #1877f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* =========================
           NAČÍTAVANIE
        ========================= */

        .loading {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }

        /* =========================
           MOBIL
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 100%;
            }

            .main {
                display: none;
            }

            .sidebar.chat-open {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         ĽAVÝ PANEL
    ========================= -->

    <aside class="sidebar">

        <div class="top">

            <div class="logo-title">
                <div class="logo">N</div>
                <h1>NexoChat</h1>
            </div>

            <button
                class="profile-btn"
                id="profileBtn"
                title="Profil"
            >
                👤
            </button>

        </div>


        <!-- PROFIL -->

        <div
            class="profile-info"
            id="profileInfo"
        >
            <div
                class="profile-name"
                id="profileName"
            >
                Používateľ
            </div>

            <div
                class="profile-email"
                id="profileEmail"
            >
                —
            </div>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Odhlásiť sa
            </button>
        </div>


        <!-- VYHĽADÁVANIE -->

        <div class="search-wrapper">

            <input
                type="text"
                class="search-box"
                id="searchInput"
                placeholder="🔍 Meno a priezvisko"
                autocomplete="off"
            >

            <!-- NAŠEPKÁVAČ -->

            <div
                class="suggestions"
                id="suggestions"
            ></div>

        </div>


        <!-- ZOZNAM CHATOV -->

        <div
            class="chats"
            id="chatList"
        >
            <div class="loading">
                Načítavam chaty...
            </div>
        </div>

    </aside>


    <!-- =========================
         PRAVÁ STRANA
    ========================= -->

    <main class="main">

        <!-- ÚVOD -->

        <section
            class="welcome"
            id="welcome"
        >

            <div class="welcome-logo">
                N
            </div>

            <h2>
                Vitaj v NexoChat
            </h2>

            <p>
                Vyhľadaj používateľa podľa mena a priezviska
                a začni si písať.
            </p>

        </section>


        <!-- CHAT -->

        <section
            class="chat-window"
            id="chatWindow"
        >

            <header class="chat-header">

                <div
                    class="avatar small-avatar"
                    id="chatAvatar"
                >
                    N
                </div>

                <div class="chat-user">

                    <div
                        class="chat-user-name"
                        id="chatName"
                    >
                        Používateľ
                    </div>

                    <div class="chat-status">
                        NexoChat
                    </div>

                </div>


                <!-- VOLANIE -->

                <button
                    class="header-btn"
                    id="callBtn"
                    title="Volanie"
                >
                    📞
                </button>

            </header>


            <!-- SPRÁVY -->

            <div
                class="messages"
                id="messages"
            >
                <div class="empty">
                    Vyber používateľa a začni konverzáciu.
                </div>
            </div>


            <!-- FORMULÁR SPRÁVY -->

            <form
                class="message-form"
                id="messageForm"
            >

                <!-- PRÍLOHA -->

                <input
                    type="file"
                    id="fileInput"
                >

                <button
                    type="button"
                    class="header-btn"
                    id="attachBtn"
                    title="Poslať prílohu"
                >
                    📎
                </button>


                <!-- TEXT -->

                <input
                    type="text"
                    class="message-input"
                    id="messageInput"
                    placeholder="Napíš správu..."
                    autocomplete="off"
                >


                <!-- ODOSLAŤ -->

                <button
                    type="submit"
                    class="send-btn"
                    title="Odoslať"

                    ➤

            </form>

        </section>

    </main>

</div>


<!-- =========================
     MODAL VOLANIA
========================= -->

<div
    class="modal"
    id="callModal"
>

    <div class="modal-box">

        <div class="modal-icon">
            📞
        </div>

        <h3>
            Volania
        </h3>

        <p>
            Táto funkcia sa pripravuje.
            Čoskoro budeš môcť volať svojim kontaktom.
        </p>

        <button
            class="close-btn"
            id="closeCallBtn"
        >
            Zavrieť
        </button>

    </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
        getFirestore,
        collection,
        doc,
        getDoc,
        getDocs,
        query,
        where,
        orderBy,
        limit,
        onSnapshot,
        addDoc,
        setDoc,
        serverTimestamp
    }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    import {
        getStorage,
        ref,
        uploadBytes,
        getDownloadURL
    }
        from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDijyOClNir_WcUOBfgCXmk0gNkrL_QBW4",

        authDomain:
            "nexochat-a2b36.firebaseapp.com",

        projectId:
            "nexochat-a2b36",

        storageBucket:
            "nexochat-a2b36.firebasestorage.app",

        messagingSenderId:
            "648415715222",

        appId:
            "1:648415715222:web:37ed1d320ccc72690907b7",

        measurementId:
            "G-2F0XV4S8LG"
    };


    const firebaseApp =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(firebaseApp);

    const db =
        getFirestore(firebaseApp);

    const storage =
        getStorage(firebaseApp);


    /* =========================
       PREMENNÉ
    ========================= */

    let currentUser = null;
    let selectedUser = null;
    let unsubscribeMessages = null;
    let searchTimer = null;


    /* =========================
       ELEMENTY
    ========================= */

    const searchInput =
        document.getElementById("searchInput");

    const suggestions =
        document.getElementById("suggestions");

    const chatList =
        document.getElementById("chatList");

    const welcome =
        document.getElementById("welcome");

    const chatWindow =
        document.getElementById("chatWindow");

    const messages =
        document.getElementById("messages");

    const messageInput =
        document.getElementById("messageInput");

    const fileInput =
        document.getElementById("fileInput");


    /* =========================
       AUTH
    ========================= */

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                window.location.href =
                    "login.html";

                return;
            }

            currentUser = user;

            document.getElementById(
                "profileEmail"
            ).textContent =
                user.email || "";

            await loadCurrentUser();

            await loadChats();
        }
    );


    /* =========================
       NAČÍTANIE PROFILU
    ========================= */

    async function loadCurrentUser() {

        try {

            const userRef =
                doc(
                    db,
                    "users",
                    currentUser.uid
                );

            const snapshot =
                await getDoc(userRef);

            if (snapshot.exists()) {

                const data =
                    snapshot.data();

                const name =
                    `${data.firstName || ""} ${data.lastName || ""}`.trim();

                document.getElementById(
                    "profileName"
                ).textContent =
                    name || "Používateľ";
            }

        } catch (error) {

            console.error(
                "Profil:",
                error
            );
        }
    }


    /* =========================
       NAŠEPKÁVAČ
    ========================= */

    searchInput.addEventListener(
        "input",
        () => {

            clearTimeout(searchTimer);

            const value =
                searchInput.value.trim();

            if (value.length < 2) {

                suggestions.style.display =
                    "none";

                suggestions.innerHTML =
                    "";

                return;
            }

            suggestions.style.display =
                "block";

            suggestions.innerHTML =
                `<div class="suggestions-title">
                    Hľadám používateľov...
                </div>`;

            searchTimer =
                setTimeout(
                    () => searchUsers(value),
                    300
                );
        }
    );


    async function searchUsers(value) {

        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "users"
                    )
                );

            suggestions.innerHTML =
                `<div class="suggestions-title">
                    Používatelia
                </div>`;

            let found = false;

            const search =
                value.toLowerCase();

            snapshot.forEach(
                (userDoc) => {

                    const data =
                        userDoc.data();

                    if (
                        data.uid ===
                        currentUser.uid
                    ) {
                        return;
                    }

                    const first =
                        String(
                            data.firstName || ""
                        );

                    const last =
                        String(
                            data.lastName || ""
                        );

                    const fullName =
                        `${first} ${last}`.trim();

                    const firstLower =
                        first.toLowerCase();

                    const lastLower =
                        last.toLowerCase();

                    const fullLower =
                        fullName.toLowerCase();

                    if (
                        firstLower.includes(search) ||
                        lastLower.includes(search) ||
                        fullLower.includes(search)
                    ) {

                        found = true;

                        const initials =
                            getInitials(
                                fullName
                            );

                        const result =
                            document.createElement(
                                "div"
                            );

                        result.className =
                            "suggestion";

                        result.innerHTML = `
                            <div class="avatar small-avatar">
                                ${escapeHtml(initials)}
                            </div>

                            <div class="suggestion-info">

                                <div class="suggestion-name">
                                    ${escapeHtml(fullName)}
                                </div>

                                <div class="suggestion-email">
                                    ${escapeHtml(
                                        data.email ||
                                        "NexoChat používateľ"
                                    )}
                                </div>

                            </div>
                        `;

                        result.addEventListener(
                            "click",
                            () => {

                                openChat({

                                    uid:
                                        data.uid ||
                                        userDoc.id,

                                    name:
                                        fullName,

                                    initials:
                                        initials
                                });
                            }
                        );

                        suggestions.appendChild(
                            result
                        );
                    }
                }
            );

            if (!found) {

                suggestions.innerHTML =
                    `<div class="no-results">
                        Používateľ sa nenašiel.
                    </div>`;
            }

        } catch (error) {

            console.error(
                "Vyhľadávanie:",
                error
            );

            suggestions.innerHTML =
                `<div class="no-results">
                    Vyhľadávanie sa nepodarilo.
                </div>`;
        }
    }


    /* =========================
       OTVORENIE CHATU
    ========================= */

    async function openChat(user) {

        selectedUser =
            user;

        welcome.style.display =
            "none";

        chatWindow.style.display =
            "flex";

        document.getElementById(
            "chatName"
        ).textContent =
            user.name;

        document.getElementById(
            "chatAvatar"
        ).textContent =
            user.initials;

        suggestions.style.display =
            "none";

        searchInput.value =
            "";

        await loadMessages();

        messageInput.focus();
    }


    /* =========================
       CHAT ID
    ========================= */

    function getChatId(
        uid1,
        uid2
    ) {

        return [
            uid1,
            uid2
        ]
        .sort()
        .join("_");
    }


    /* =========================
       SPRÁVY REAL-TIME
    ========================= */

    async function loadMessages() {

        if (
            !currentUser ||
            !selectedUser
        ) {
            return;
        }

        if (unsubscribeMessages) {

            unsubscribeMessages();

            unsubscribeMessages =
                null;
        }

        const chatId =
            getChatId(
                currentUser.uid,
                selectedUser.uid
            );

        const messagesRef =
            collection(
                db,
                "chats",
                chatId,
                "messages"
            );

        const messagesQuery =
            query(
                messagesRef,
                orderBy(
                    "createdAt",
                    "asc"
                )
            );

        unsubscribeMessages =
            onSnapshot(
                messagesQuery,
                (snapshot) => {

                    messages.innerHTML =
                        "";

                    if (
                        snapshot.empty
                    ) {

                        messages.innerHTML =
                            `<div class="empty">
                                Zatiaľ žiadne správy.
                                Napíš prvú správu.
                            </div>`;

                        return;
                    }

                    snapshot.forEach(
                        (messageDoc) => {

                            renderMessage(
                                messageDoc.data()
                            );
                        }
                    );

                    messages.scrollTop =
                        messages.scrollHeight;
                },
                (error) => {

                    console.error(
                        "Správy:",
                        error
                    );

                    messages.innerHTML =
                        `<div class="empty">
                            Správy sa nepodarilo načítať.
                        </div>`;
                }
            );
    }


    /* =========================
       VYKRESLENIE SPRÁVY
    ========================= */

    function renderMessage(data) {

        const element =
            document.createElement(
                "div"
            );

        const mine =
            data.senderId ===
            currentUser.uid;

        element.className =
            mine
                ? "message mine"
                : "message";

        let html =
            "";

        if (data.fileUrl) {

            html += `
                <div class="message-file">
                    📎
                    <a
                        href="${escapeAttribute(data.fileUrl)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHtml(
                            data.fileName ||
                            "Príloha"
                        )}
                    </a>
                </div>
            `;
        }

        if (data.text) {

            html += `
                <div class="message-text">
                    ${escapeHtml(data.text)}
                </div>
            `;
        }

        html += `
            <div class="message-time">
                ${formatTime(data.createdAt)}
            </div>
        `;

        element.innerHTML =
            html;

        messages.appendChild(
            element
        );
    }


    /* =========================
       ODOSLANIE SPRÁVY
    ========================= */

    document.getElementById(
        "messageForm"
    ).addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            if (
                !currentUser ||
                !selectedUser
            ) {
                return;
            }

            const text =
                messageInput.value.trim();

            if (!text) {
                return;
            }

            const chatId =
                getChatId(
                    currentUser.uid,
                    selectedUser.uid
                );

            try {

                await addDoc(
                    collection(
                        db,
                        "chats",
                        chatId,
                        "messages"
                    ),
                    {
                        text:
                            text,

                        senderId:
                            currentUser.uid,

                        receiverId:
                            selectedUser.uid,

                        createdAt:
                            serverTimestamp()
                    }
                );

                await updateChatInfo(
                    chatId,
                    text
                );

                messageInput.value =
                    "";

            } catch (error) {

                console.error(
                    "Odoslanie:",
                    error
                );

                alert(
                    "Správu sa nepodarilo odoslať."
                );
            }
        }
    );


    /* =========================
       PRÍLOHA
    ========================= */

    document.getElementById(
        "attachBtn"
    ).addEventListener(
        "click",
        () => {

            if (!selectedUser) {

                alert(
                    "Najprv otvor chat."
                );

                return;
            }

            fileInput.click();
        }
    );


    fileInput.addEventListener(
        "change",
        async () => {

            const file =
                fileInput.files[0];

            if (
                !file ||
                !currentUser ||
                !selectedUser
            ) {
                return;
            }

            try {

                const safeName =
                    file.name.replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );

                const filePath =
                    `chatFiles/${currentUser.uid}/${Date.now()}_${safeName}`;

                const fileRef =
                    ref(
                        storage,
                        filePath
                    );

                await uploadBytes(
                    fileRef,
                    file
                );

                const fileUrl =
                    await getDownloadURL(
                        fileRef
                    );

                const chatId =
                    getChatId(
                        currentUser.uid,
                        selectedUser.uid
                    );

                await addDoc(
                    collection(
                        db,
                        "chats",
                        chatId,
                        "messages"
                    ),
                    {
                        text:
                            "",

                        fileUrl:
                            fileUrl,

                        fileName:
                            file.name,

                        fileType:
                            file.type,

                        fileSize:
                            file.size,

                        senderId:
                            currentUser.uid,

                        receiverId:
                            selectedUser.uid,

                        createdAt:
                            serverTimestamp()
                    }
                );

                await updateChatInfo(
                    chatId,
                    "📎 Príloha"
                );

                fileInput.value =
                    "";

            } catch (error) {

                console.error(
                    "Príloha:",
                    error
                );

                alert(
                    "Prílohu sa nepodarilo odoslať."
                );

                fileInput.value =
                    "";
            }
        }
    );


    /* =========================
       INFORMÁCIE O CHATE
    ========================= */

    async function updateChatInfo(
        chatId,
        lastMessage
    ) {

        try {

            await setDoc(
                doc(
                    db,
                    "chats",
                    chatId
                ),
                {
                    participants: [
                        currentUser.uid,
                        selectedUser.uid
                    ],

                    lastMessage:
                        lastMessage,

                    lastMessageAt:
                        serverTimestamp()
                },
                {
                    merge: true
                }
            );

        } catch (error) {

            console.error(
                "Chat info:",
                error
            );
        }
    }


    /* =========================
       ZOZNAM CHATOV
    ========================= */

    async function loadChats() {

        if (!currentUser) {
            return;
        }

        try {

            const chatsQuery =
                query(
                    collection(
                        db,
                        "chats"
                    ),
                    where(
                        "participants",
                        "array-contains",
                        currentUser.uid
                    ),
                    orderBy(
                        "lastMessageAt",
                        "desc"
                    )
                );

            onSnapshot(
                chatsQuery,
                async (snapshot) => {

                    chatList.innerHTML =
                        "";

                    if (snapshot.empty) {

                        chatList.innerHTML =
                            `<div class="empty">
                                Zatiaľ nemáš žiadne chaty.
                                <br><br>
                                Vyhľadaj používateľa hore.
                            </div>`;

                        return;
                    }

                    for (
                        const chatDoc of snapshot.docs
                    ) {

                        const data =
                            chatDoc.data();

                        const otherUid =
                            data.participants.find(
                                uid =>
                                    uid !==
                                    currentUser.uid
                            );

                        if (!otherUid) {
                            continue;
                        }

                        try {

                            const userSnapshot =
                                await getDoc(
                                    doc(
                                        db,
                                        "users",
                                        otherUid
                                    )
                                );

                            if (
                                !userSnapshot.exists()
                            ) {
                                continue;
                            }

                            const user =
                                userSnapshot.data();

                            const name =
                                `${user.firstName || ""} ${user.lastName || ""}`.trim();

                            const initials =
                                getInitials(
                                    name
                                );

                            const chat =
                                document.createElement(
                                    "div"
                                );

                            chat.className =
                                "chat";

                            chat.innerHTML = `
                                <div class="avatar">
                                    ${escapeHtml(initials)}
                                </div>

                                <div class="chat-info">

                                    <div class="chat-name">
                                        ${escapeHtml(name)}
                                    </div>

                                    <div class="last-message">
                                        ${escapeHtml(
                                            data.lastMessage ||
                                            "Nový chat"
                                        )}
                                    </div>

                                </div>

                                <div class="time">
                                    ${formatTime(
                                        data.lastMessageAt
                                    )}
                                </div>
                            `;

                            chat.addEventListener(
                                "click",
                                () => {

                                    openChat({
                                        uid:
                                            otherUid,

                                        name:
                                            name,

                                        initials:
                                            initials
                                    });
                                }
                            );

                            chatList.appendChild(
                                chat
                            );

                        } catch (error) {

                            console.error(
                                error
                            );
                        }
                    }

                },
                (error) => {

                    console.error(
                        "Chaty:",
                        error
                    );

                    chatList.innerHTML =
                        `<div class="empty">
                            Chaty sa nepodarilo načítať.
                        </div>`;
                }
            );

        } catch (error) {

            console.error(
                "Načítanie chatov:",
                error
            );

            chatList.innerHTML =
                `<div class="empty">
                    Chaty sa nepodarilo načítať.
                </div>`;
        }
    }


    /* =========================
       PROFIL
    ========================= */

    document.getElementById(
        "profileBtn"
    ).addEventListener(
        "click",
        () => {

            const profile =
                document.getElementById(
                    "profileInfo"
                );

            profile.style.display =
                profile.style.display ===
                "block"
                    ? "none"
                    : "block";
        }
    );


    /* =========================
       ODHLÁSENIE
    ========================= */

    document.getElementById(
        "logoutBtn"
    ).addEventListener(
        "click",
        async () => {

            try {

                if (unsubscribeMessages) {
                    unsubscribeMessages();
                }

                await signOut(auth);

                window.location.href =
                    "index.html";

            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Odhlásenie sa nepodarilo."
                );
            }
        }
    );


    /* =========================
       VOLANIE
    ========================= */

    document.getElementById(
        "callBtn"
    ).addEventListener(
        "click",
        () => {

            document.getElementById(
                "callModal"
            ).style.display =
                "flex";
        }
    );


    document.getElementById(
        "closeCallBtn"
    ).addEventListener(
        "click",
        () => {

            document.getElementById(
                "callModal"
            ).style.display =
                "none";
        }
    );


    /* Kliknutie mimo modalu */

    document.getElementById(
        "callModal"
    ).addEventListener(
        "click",
        (event) => {

            if (
                event.target.id ===
                "callModal"
            ) {

                event.target.style.display =
                    "none";
            }
        }
    );


    /* =========================
       POMOCNÉ FUNKCIE
    ========================= */

    function getInitials(name) {

        return name
            .split(" ")
            .filter(Boolean)
            .map(
                word =>
                    word.charAt(0)
            )
            .join("")
            .substring(0, 2)
            .toUpperCase() || "N";
    }


    function formatTime(timestamp) {

        if (!timestamp) {
            return "teraz";
        }

        try {

            const date =
                timestamp.toDate();

            return date.toLocaleTimeString(
                "sk-SK",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        } catch {

            return "teraz";
        }
    }


    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            String(text ?? "");

        return div.innerHTML;
    }


    function escapeAttribute(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }


    /* Kliknutie mimo našeptávača */

    document.addEventListener(
        "click",
        (event) => {

            if (
                !event.target.closest(
                    ".search-wrapper"
                )
            ) {

                suggestions.style.display =
                    "none";
            }
        }
    );

</script>

</body>
</html>
