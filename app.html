<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoChat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f0f2f5;
            color: #222;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* =========================
           ĽAVÝ PANEL
        ========================= */

        .sidebar {
            width: 360px;
            background: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
        }

        .top {
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 43px;
            height: 43px;
            border-radius: 14px;
            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .top h1 {
            color: #1877f2;
            font-size: 24px;
        }

        .profile-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #f0f2f5;
            cursor: pointer;
            font-size: 19px;
        }

        .profile-btn:hover {
            background: #e4e6eb;
        }

        /* =========================
           PROFIL
        ========================= */

        .profile-info {
            display: none;
            padding: 15px;
            background: #f7f8fa;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #ddd;
        }

        .profile-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .profile-email {
            color: #777;
            font-size: 13px;
            word-break: break-word;
        }

        .logout-btn {
            margin-top: 12px;
            padding: 9px 14px;
            border: none;
            border-radius: 10px;
            background: #e4e6eb;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #d8dadf;
        }

        /* =========================
           VYHĽADÁVANIE
        ========================= */

        .search-wrapper {
            padding: 0 15px 15px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 13px 16px;
            border: none;
            outline: none;
            border-radius: 22px;
            background: #f0f2f5;
            font-size: 15px;
        }

        .search-box:focus {
            background: #e8eaed;
        }

        .suggestions {
            display: none;
            position: absolute;
            left: 15px;
            right: 15px;
            top: 52px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,.12);
            max-height: 300px;
            overflow-y: auto;
            z-index: 20;
        }

        .suggestions-title {
            padding: 10px 13px;
            color: #777;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }

        .suggestion {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 13px;
            cursor: pointer;
        }

        .suggestion:hover {
            background: #f0f2f5;
        }

        .suggestion-info {
            min-width: 0;
            flex: 1;
        }

        .suggestion-name {
            font-weight: bold;
            font-size: 15px;
        }

        .suggestion-username {
            color: #1877f2;
            font-size: 12px;
            margin-top: 3px;
        }

        .suggestion-email {
            color: #777;
            font-size: 12px;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .no-results {
            padding: 18px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }

        /* =========================
           AVATAR
        ========================= */

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 17px;
            flex-shrink: 0;
        }

        .small-avatar {
            width: 43px;
            height: 43px;
            font-size: 14px;
        }

        /* =========================
           ZOZNAM CHATOV
        ========================= */

        .chats {
            flex: 1;
            overflow-y: auto;
        }

        .chat {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            cursor: pointer;
        }

        .chat:hover {
            background: #f0f2f5;
        }

        .chat.active {
            background: #eaf2ff;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .last-message {
            color: #777;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .time {
            color: #999;
            font-size: 12px;
        }

        .empty {
            text-align: center;
            padding: 30px 15px;
            color: #888;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }

        /* =========================
           PRAVÁ STRANA
        ========================= */

        .main {
            flex: 1;
            display: flex;
            background: #f7f8fa;
            min-width: 0;
        }

        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .welcome-logo {
            width: 90px;
            height: 90px;
            border-radius: 28px;
            background: #1877f2;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #777;
            max-width: 430px;
            line-height: 1.5;
        }

        /* =========================
           CHAT OKNO
        ========================= */

        .chat-window {
            display: none;
            flex: 1;
            height: 100%;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            height: 72px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 10px 18px;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-user {
            flex: 1;
            min-width: 0;
        }

        .chat-user-name {
            font-weight: bold;
            font-size: 17px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-status {
            color: #31a24c;
            font-size: 13px;
            margin-top: 3px;
        }

        .header-btn {
            width: 43px;
            height: 43px;
            border: none;
            border-radius: 50%;
            background: #f0f2f5;
            cursor: pointer;
            font-size: 19px;
            flex-shrink: 0;
        }

        .header-btn:hover {
            background: #e4e6eb;
        }

        /* =========================
           SPRÁVY
        ========================= */

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            min-height: 0;
        }

        .message {
            max-width: 65%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 18px;
            background: white;
            width: fit-content;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,.05);
        }

        .message.mine {
            margin-left: auto;
            background: #1877f2;
            color: white;
        }

        .message-text {
            white-space: pre-wrap;
        }

        .message-file {
            margin-bottom: 5px;
        }

        .message-file a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
        }

        .message-file a:hover {
            text-decoration: underline;
        }

        .message-time {
            font-size: 11px;
            opacity: .65;
            margin-top: 5px;
        }

        /* =========================
           PÍSANIE
        ========================= */

        .message-form {
            background: white;
            border-top: 1px solid #ddd;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .message-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: #f0f2f5;
            border-radius: 22px;
            padding: 13px 17px;
            font-size: 15px;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: #1264d6;
        }

        #fileInput {
            display: none;
        }

        /* =========================
           MODAL VOLANIA
        ========================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-box {
            width: 90%;
            max-width: 360px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        .modal-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .modal-box h3 {
            margin-bottom: 10px;
        }

        .modal-box p {
            color: #777;
            line-height: 1.5;
        }

        .close-btn {
            margin-top: 22px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #1877f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:hover {
            background: #1264d6;
        }

        /* =========================
           MOBIL
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 100%;
            }

            .main {
                display: none;
            }

            .sidebar.chat-open {
                display: none;
            }

            .chat-window {
                display: flex;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         ĽAVÝ PANEL
    ========================= -->

    <aside class="sidebar">

        <div class="top">

            <div class="logo-title">
                <div class="logo">N</div>
                <h1>NexoChat</h1>
            </div>

            <button
                class="profile-btn"
                id="profileBtn"
                title="Profil"
            >
                👤
            </button>

        </div>

        <!-- PROFIL -->

        <div
            class="profile-info"
            id="profileInfo"
        >
            <div
                class="profile-name"
                id="profileName"
            >
                Používateľ
            </div>

            <div
                class="profile-email"
                id="profileEmail"
            >
                —
            </div>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Odhlásiť sa
            </button>
        </div>

        <!-- VYHĽADÁVANIE -->

        <div class="search-wrapper">

            <input
                type="text"
                class="search-box"
                id="searchInput"
                placeholder="🔍 Meno a priezvisko"
                autocomplete="off"
            >

            <!-- NAŠEPKÁVAČ -->

            <div
                class="suggestions"
                id="suggestions"
            ></div>

        </div>

        <!-- ZOZNAM CHATOV -->

        <div
            class="chats"
            id="chatList"
        >
            <div class="loading">
                Načítavam chaty...
            </div>
        </div>

    </aside>

    <!-- =========================
         PRAVÁ STRANA
    ========================= -->

    <main class="main">

        <!-- ÚVOD -->

        <section
            class="welcome"
            id="welcome"
        >

            <div class="welcome-logo">
                N
            </div>

            <h2>
                Vitaj v NexoChat
            </h2>

            <p>
                Vyhľadaj používateľa podľa mena a priezviska
                a začni si písať.
            </p>

        </section>

        <!-- CHAT -->

        <section
            class="chat-window"
            id="chatWindow"
        >

            <header class="chat-header">

                <div
                    class="avatar small-avatar"
                    id="chatAvatar"
                >
                    N
                </div>

                <div class="chat-user">

                    <div
                        class="chat-user-name"
                        id="chatName"
                    >
                        Používateľ
                    </div>

                    <div class="chat-status">
                        NexoChat
                    </div>

                </div>

                <!-- VOLANIE -->

                <button
                    class="header-btn"
                    id="callBtn"
                    title="Volanie"
                >
                    📞
                </button>

            </header>

            <!-- SPRÁVY -->

            <div
                class="messages"
                id="messages"
            >
                <div class="empty">
                    Vyber používateľa a začni konverzáciu.
                </div>
            </div>

            <!-- FORMULÁR SPRÁVY -->

            <form
                class="message-form"
                id="messageForm"
            >

                <!-- PRÍLOHA -->

                <input
                    type="file"
                    id="fileInput"
                >

                <button
                    type="button"
                    class="header-btn"
                    id="attachBtn"
                    title="Poslať prílohu"
                >
                    📎
                </button>

                <!-- TEXT -->

                <input
                    type="text"
                    class="message-input"
                    id="messageInput"
                    placeholder="Napíš správu..."
                    autocomplete="off"
                >

                <!-- ODOSLAŤ -->

                <button
                    type="submit"
                    class="send-btn"
                    title="Odoslať"
                >
                    ➤
                </button>

            </form>

        </section>

    </main>

</div>

<!-- =========================
     MODAL VOLANIA
========================= -->

<div
    class="modal"
    id="callModal"
>

    <div class="modal-box">

        <div class="modal-icon">
            📞
        </div>

        <h3>
            Volania
        </h3>

        <p>
            Táto funkcia sa pripravuje.
            Čoskoro budeš môcť volať svojim kontaktom.
        </p>

        <button
            class="close-btn"
            id="closeCallBtn"
        >
            Zavrieť
        </button>

    </div>

</div>

<!-- =========================
     APP.JS
========================= -->

<script type="module" src="app.js"></script>

</body>
</html>
